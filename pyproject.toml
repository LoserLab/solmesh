[project]
name = "solmesh"
version = "0.2.0"
description = "Send Solana transactions over Meshtastic/LoRa mesh networks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "meshtastic>=2.0",
    "solders>=0.21.0",
    "solana>=0.32.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "cryptography>=41.0",
    "mnemonic>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
solmesh = "solmesh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solmesh"]
